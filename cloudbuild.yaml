steps:
  # 1. Build container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/agencyos:$COMMIT_SHA"
      - "."

  # 2. Push container image to Artifact Registry / Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/agencyos:$COMMIT_SHA"

  # 3. Deploy to Google Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "agencyos-web"
      - "--image"
      - "gcr.io/$PROJECT_ID/agencyos:$COMMIT_SHA"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"

images:
  - "gcr.io/$PROJECT_ID/agencyos:$COMMIT_SHA"
